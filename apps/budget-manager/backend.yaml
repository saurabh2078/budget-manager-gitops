apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: budget-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/saurabh2078/budget-manager-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: budgetdb
            - name: DB_USER
              value: budgetuser
            - name: DB_PASSWORD
              value: budgetpass

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: budget-manager
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
